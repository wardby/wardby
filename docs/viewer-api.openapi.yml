openapi: 3.1.0
info:
  title: wardby admin viewer API
  version: 0.7.0
  description: "Read-only admin API behind the wardby viewer: graph, run detail, infrastructure info and a live event stream. Response objects may gain new fields in later releases; clients should ignore unknown fields. See docs/viewer-api.md for the prose contract."
servers:
  - url: https://{host}
    variables:
      host:
        default: wardby.example.com
paths:
  /admin/api/graph:
    get:
      operationId: getGraph
      summary: Graph snapshot
      description: |-
        Agents, runs, coding-run services and outcomes for a time window, as a graph.

        Requires a bearer token with the `admin:view` scope, held by a caller with the admin role.
      security:
        - bearer: []
      parameters:
        - name: since
          in: query
          required: false
          description: "Window start: `15m`, `1h`, `6h`, `24h`, `7d`, or an ISO-8601 timestamp. Default `1h`."
          schema:
            type: string
            default: 1h
        - name: limit
          in: query
          required: false
          description: Maximum number of runs, 1 to 2000. Default 500.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 500
      responses:
        "200":
          description: The graph snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/graph-snapshot"
        "400":
          description: A query parameter is invalid.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ViewerError"
                  - properties:
                      error:
                        enum:
                          - invalid_since
                          - invalid_limit
          x-error-codes:
            - invalid_since
            - invalid_limit
        "401":
          description: No valid bearer token.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ViewerError"
                  - properties:
                      error:
                        enum:
                          - invalid_token
          x-error-codes:
            - invalid_token
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/WWWAuthenticate"
        "403":
          description: Token lacks the `admin:view` scope (the `WWW-Authenticate` header is present), or the caller lacks the admin role (no `WWW-Authenticate` header).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ViewerError"
                  - properties:
                      error:
                        enum:
                          - invalid_token
          x-error-codes:
            - invalid_token
          headers:
            WWW-Authenticate:
              $ref: "#/components/headers/WWWAuthenticate"
        "405":
          description: Only GET is allowed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ViewerError"
                  - properties:
                      error:
                        enum:
                          - method_not_allowed
          x-error-codes:
            - method_not_allowed
          headers:
            Allow:
              description: "Allowed methods: GET."
              schema:
                type: string
                enum:
                  - GET
        default:
          description: Unexpected server error (HTTP 500). `id` identifies the failure in the server log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewerInternalError"
