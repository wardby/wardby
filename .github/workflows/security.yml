name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  # New CVEs are published against images that have not changed. Without a
  # schedule, a quiet week leaves main's images unscanned against the current
  # vulnerability database.
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  # verify used to run every check below in one job, one after another. They are
  # independent, so they run as three parallel jobs, and `verify` (the check
  # branch protection requires) passes only when all three do.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:production-boundary
      - run: npm ls --all --json > dependency-tree.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-tree
          path: dependency-tree.json
      - run: node scripts/security-audit.mjs

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wardby
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: security
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wardby:test-only@localhost:5432/security
      # Public deterministic fixture material for tests only; never a deployment key.
      SECRET_APP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The browser download is cached per Playwright version; its system
      # libraries still come from apt every run.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
      - run: npm test

  package:
    runs-on: ubuntu-latest
    # Package acceptance creates a throwaway database on this server.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wardby
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: security
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wardby:test-only@localhost:5432/security
      # Public deterministic fixture material for tests only; never a deployment key.
      SECRET_APP_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
      - run: node --expose-gc scripts/security-allocation-check.mjs

  verify:
    if: always()
    needs: [checks, tests, package]
    runs-on: ubuntu-latest
    steps:
      - name: All verify jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "checks, tests, package: $RESULTS"
          for result in $RESULTS; do [ "$result" = "success" ] || exit 1; done

  # The image jobs deliberately do not wait on verify. They use nothing it
  # produces, so running them alongside it halves the workflow's wall-clock
  # time, and a flaky unit test no longer skips the image scans.
  worker-image:
    runs-on: ubuntu-latest
    strategy:
      # Keep image scan evidence from the unaffected variants when one fails.
      fail-fast: false
      matrix:
        include:
          - dockerfile: src/coding-worker/Dockerfile
            tag-suffix: node
            kind: runtime
          - dockerfile: src/coding-worker/Dockerfile.node-python
            tag-suffix: node-python
            kind: runtime
          - dockerfile: src/coding-worker/Dockerfile.driver
            tag-suffix: driver
            kind: driver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/coding-worker-image-policy.mjs ../${{ matrix.dockerfile }} --kind=${{ matrix.kind }}
      - run: docker build -f ${{ matrix.dockerfile }} -t wardby-coding-worker-${{ matrix.tag-suffix }}:${{ github.sha }} .
      - if: matrix.tag-suffix == 'node'
        run: npm run test:docker-isolation
        env:
          WARDBY_WORKER_IMAGE: wardby-coding-worker-node:${{ github.sha }}
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: wardby-coding-worker-${{ matrix.tag-suffix }}:${{ github.sha }}
          format: spdx-json
          output-file: coding-worker-${{ matrix.tag-suffix }}.spdx.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wardby-coding-worker-${{ matrix.tag-suffix }}:${{ github.sha }}
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coding-worker-sbom-${{ matrix.tag-suffix }}
          path: coding-worker-${{ matrix.tag-suffix }}.spdx.json

  claude-worker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:phase5
      - run: docker build -f src/claude-coding-worker/Dockerfile.compatibility -t wardby-claude-compat:${{ github.sha }} .
      - run: docker run --rm wardby-claude-compat:${{ github.sha }}
      - run: docker build -f src/claude-coding-worker/Dockerfile -t wardby-claude-coding-worker:${{ github.sha }} .
      - run: docker build -f src/claude-tool-runner/Dockerfile -t wardby-claude-tool-runner:${{ github.sha }} .
      - run: docker build -f src/claude-tool-runner/Dockerfile --target node-python -t wardby-claude-tool-runner-node-python:${{ github.sha }} .
      - run: npm run test:claude-docker
        env:
          WARDBY_CLAUDE_WORKER_IMAGE: wardby-claude-coding-worker:${{ github.sha }}
          WARDBY_CLAUDE_TOOL_RUNNER_IMAGE: wardby-claude-tool-runner:${{ github.sha }}
          WARDBY_DOCKER_SEED_DEBUG: "1"
          WARDBY_CLAUDE_KEEPER_PROBE: "1"
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: wardby-claude-coding-worker:${{ github.sha }}
          format: spdx-json
          output-file: claude-coding-worker.spdx.json
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: wardby-claude-tool-runner:${{ github.sha }}
          format: spdx-json
          output-file: claude-tool-runner.spdx.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wardby-claude-coding-worker:${{ github.sha }}
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wardby-claude-tool-runner:${{ github.sha }}
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: claude-worker-sboms
          path: |
            claude-coding-worker.spdx.json
            claude-tool-runner.spdx.json
