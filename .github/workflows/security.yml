name: Security checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reevo
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: security
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://reevo:test-only@localhost:5432/security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node --expose-gc scripts/security-allocation-check.mjs
      - run: npm ls --all --json > dependency-tree.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: dependency-tree.json
      - run: node scripts/security-audit.mjs
