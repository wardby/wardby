# CodeQL for the TypeScript code and the workflows themselves, on every pull
# request. Rust (the desktop viewer) is in codeql-rust.yml, which runs only when
# Rust changes: its analysis is the slowest check and almost no pull request
# touches it. Same languages and query suite (security-extended) as GitHub's
# default setup, which this replaces.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # The release suite's Flow G and Flow J runners (test-only, never shipped) write their own
          # run reports from the local simulator's responses, which js/http-to-file-access flags on
          # every change (#33, #34). Only these two files are left out; the rest of tools/wardby-sim
          # is still analyzed.
          config: |
            paths-ignore:
              - tools/wardby-sim/src/flow-g/runner.ts
              - tools/wardby-sim/src/flow-j/runner.ts
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
