# CodeQL for the TypeScript code and the workflows themselves, on every pull
# request. Rust (the desktop viewer) is in codeql-rust.yml, which runs only when
# Rust changes: its analysis is the slowest check and almost no pull request
# touches it. Same languages and query suite (security-extended) as GitHub's
# default setup, which this replaces.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 2"
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
