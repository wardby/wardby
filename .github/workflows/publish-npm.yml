name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  # Publishes the images the quickstart's optional coding step runs, before the
  # package that references them. Release publishing only; nothing is deployed.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
    outputs:
      runtime: ${{ steps.runtime.outputs.digest }}
      worker: ${{ steps.worker.outputs.digest }}
      claude-worker: ${{ steps.claude-worker.outputs.digest }}
      claude-tool-runner: ${{ steps.claude-tool-runner.outputs.digest }}
      worker-node-python: ${{ steps.worker-node-python.outputs.digest }}
      claude-tool-runner-node-python: ${{ steps.claude-tool-runner-node-python.outputs.digest }}
      native-worker: ${{ steps.native-worker.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # Before anything else runs, so a release whose tag does not match package.json pushes no
      # images (and, since publish needs this job, publishes nothing).
      - name: Verify release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e 'const { readFileSync } = require("node:fs");
          const { version } = JSON.parse(readFileSync("package.json", "utf8"));
          if (process.env.RELEASE_TAG !== `v${version}`)
          throw new Error(`release ${process.env.RELEASE_TAG} does not match v${version}`);'
      - run: npm ci --ignore-scripts
      - run: node scripts/coding-worker-image-policy.mjs ../src/coding-worker/Dockerfile --kind=runtime
      - run: node scripts/coding-worker-image-policy.mjs ../src/coding-worker/Dockerfile.node-python --kind=runtime
      # The Codex worker inherits protocol.js from its pinned driver: refuse to publish it when that
      # driver predates src/coding/protocol.ts (a new driver-v* must be published and pinned first).
      - run: npm run build && node scripts/check-worker-protocol.mjs --from-dockerfile src/coding-worker/Dockerfile
      # The Node + Python worker is built on the same pinned driver, so it gets the same guard.
      - run: node scripts/check-worker-protocol.mjs --from-dockerfile src/coding-worker/Dockerfile.node-python
      # The Codex policy script checks Codex-specific pins, so the Claude Code
      # images are gated by their own policy tests instead.
      - run: npx vitest run src/claude-coding-worker/image-policy.test.ts src/claude-tool-runner/image-policy.test.ts src/native-worker/image-policy.test.ts
      # The same driver-reference check the publish job runs before recording it in
      # dist/quickstart-images.json, here so a bad FROM fails before any image is pushed.
      - name: Verify the worker's driver reference is digest-pinned
        run: >-
          node -e 'const { readFileSync } = require("node:fs");
          const driver = /^FROM\s+(\S+)/im.exec(readFileSync("src/coding-worker/Dockerfile", "utf8"))?.[1] ?? "";
          if (!/^[a-z0-9][a-z0-9._\/:-]*@sha256:[0-9a-f]{64}$/.test(driver)) throw new Error(`bad driver ${driver}`);'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: runtime
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/wardby-runtime:${{ github.event.release.tag_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: worker
        with:
          context: .
          file: src/coding-worker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/wardby-coding-worker:${{ github.event.release.tag_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: claude-worker
        with:
          context: .
          file: src/claude-coding-worker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/wardby-claude-coding-worker:${{ github.event.release.tag_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: claude-tool-runner
        with:
          context: .
          file: src/claude-tool-runner/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/wardby-claude-tool-runner:${{ github.event.release.tag_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: worker-node-python
        with:
          context: .
          file: src/coding-worker/Dockerfile.node-python
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/wardby-coding-worker-node-python:${{ github.event.release.tag_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: claude-tool-runner-node-python
        with:
          context: .
          file: src/claude-tool-runner/Dockerfile
          target: node-python
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/wardby-claude-tool-runner-node-python:${{ github.event.release.tag_name }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: native-worker
        with:
          context: .
          file: src/native-worker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/wardby-native-worker:${{ github.event.release.tag_name }}

  publish:
    needs: images
    runs-on: ubuntu-latest
    # test:package installs the packed tarball in a linux/amd64 container and
    # runs quickstart's migrations and the CLI against a throwaway database it
    # creates beside DATABASE_URL (reached from the container through
    # host.docker.internal / host-gateway). A test-only service, as in
    # security.yml -- nothing here deploys anything.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wardby
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: package
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      # Ship the pushed digests in the tarball (dist/ is in "files"). The
      # quickstart resolves images by digest only, never by tag. `driver` is the
      # pinned base of the worker images (src/coding-worker/Dockerfile's FROM),
      # which `wardby doctor` prints for building your own worker image.
      - name: Record image digests
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RUNTIME_DIGEST: ${{ needs.images.outputs.runtime }}
          WORKER_DIGEST: ${{ needs.images.outputs.worker }}
          CLAUDE_WORKER_DIGEST: ${{ needs.images.outputs.claude-worker }}
          CLAUDE_TOOL_RUNNER_DIGEST: ${{ needs.images.outputs.claude-tool-runner }}
          WORKER_NODE_PYTHON_DIGEST: ${{ needs.images.outputs.worker-node-python }}
          CLAUDE_TOOL_RUNNER_NODE_PYTHON_DIGEST: ${{ needs.images.outputs.claude-tool-runner-node-python }}
          NATIVE_WORKER_DIGEST: ${{ needs.images.outputs.native-worker }}
        run: >-
          node -e 'const { mkdirSync, readFileSync, writeFileSync } = require("node:fs");
          const { IMAGE_PREFIX, RUNTIME_DIGEST, WORKER_DIGEST, CLAUDE_WORKER_DIGEST, CLAUDE_TOOL_RUNNER_DIGEST,
          WORKER_NODE_PYTHON_DIGEST, CLAUDE_TOOL_RUNNER_NODE_PYTHON_DIGEST, NATIVE_WORKER_DIGEST } = process.env;
          for (const d of [RUNTIME_DIGEST, WORKER_DIGEST, CLAUDE_WORKER_DIGEST, CLAUDE_TOOL_RUNNER_DIGEST,
          WORKER_NODE_PYTHON_DIGEST, CLAUDE_TOOL_RUNNER_NODE_PYTHON_DIGEST, NATIVE_WORKER_DIGEST])
          if (!/^sha256:[0-9a-f]{64}$/.test(d)) throw new Error(`bad digest ${d}`);
          const driver = /^FROM\s+(\S+)/im.exec(readFileSync("src/coding-worker/Dockerfile", "utf8"))?.[1] ?? "";
          if (!/^[a-z0-9][a-z0-9._\/:-]*@sha256:[0-9a-f]{64}$/.test(driver)) throw new Error(`bad driver ${driver}`);
          mkdirSync("dist", { recursive: true });
          writeFileSync("dist/quickstart-images.json", JSON.stringify({
          runtime: `${IMAGE_PREFIX}/wardby-runtime@${RUNTIME_DIGEST}`,
          worker: `${IMAGE_PREFIX}/wardby-coding-worker@${WORKER_DIGEST}`,
          claudeWorker: `${IMAGE_PREFIX}/wardby-claude-coding-worker@${CLAUDE_WORKER_DIGEST}`,
          claudeToolRunner: `${IMAGE_PREFIX}/wardby-claude-tool-runner@${CLAUDE_TOOL_RUNNER_DIGEST}`,
          workerNodePython: `${IMAGE_PREFIX}/wardby-coding-worker-node-python@${WORKER_NODE_PYTHON_DIGEST}`,
          claudeToolRunnerNodePython: `${IMAGE_PREFIX}/wardby-claude-tool-runner-node-python@${CLAUDE_TOOL_RUNNER_NODE_PYTHON_DIGEST}`,
          nativeWorker: `${IMAGE_PREFIX}/wardby-native-worker@${NATIVE_WORKER_DIGEST}`,
          driver }) + "\n");'
      - run: npm run test:package
        env:
          DATABASE_URL: postgresql://wardby:test-only@localhost:5432/package
      # --provenance, not publishConfig.provenance: the latter applies
      # everywhere and makes `npm publish` fail outside a supported CI, which
      # would block a manual publish from a maintainer's machine. As a flag it
      # applies only here, where id-token: write above makes the OIDC signature
      # available.
      #
      # Provenance is what lets someone installing @wardby/cli verify the
      # tarball was built from this repository at a commit they can read, rather
      # than uploaded by whoever held a token. That matters more than usual for
      # a tool people hand GitHub App keys, provider tokens and cluster access
      # to. It requires a public repository, since the referenced commit has to
      # be resolvable.
      - run: npm publish --access public --provenance
