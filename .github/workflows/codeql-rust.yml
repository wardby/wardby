# CodeQL for the desktop viewer's Rust (apps/viewer/src-tauri). Its analysis
# takes several minutes, so it runs only when Rust changes, plus weekly on main
# so new queries still reach unchanged code. See codeql.yml for the rest.
name: CodeQL (Rust)
on:
  push:
    branches: [main]
    paths: ["apps/viewer/src-tauri/**"]
  pull_request:
    paths: ["apps/viewer/src-tauri/**"]
  schedule:
    - cron: "41 4 * * 2"
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:rust
