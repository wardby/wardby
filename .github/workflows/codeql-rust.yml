# CodeQL for Wardby's Rust: the desktop viewer (apps/viewer/src-tauri) and the
# toolchain command agent (src/command-agent). Its analysis takes several
# minutes, so it runs only when Rust changes, plus weekly on main so new queries
# still reach unchanged code. See codeql.yml for the rest.
name: CodeQL (Rust)
on:
  push:
    branches: [main]
    paths: ["apps/viewer/src-tauri/**", "src/command-agent/**"]
  pull_request:
    paths: ["apps/viewer/src-tauri/**", "src/command-agent/**"]
  schedule:
    - cron: "41 4 * * 2"
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:rust
