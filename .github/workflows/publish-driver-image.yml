name: Publish coding-worker driver image
on:
  push:
    tags: ["driver-v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/wardby-coding-worker-driver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/coding-worker-image-policy.mjs ../src/coding-worker/Dockerfile.driver --kind=driver
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          file: src/coding-worker/Dockerfile.driver
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
      - name: Publish digest as a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Driver image digest: \`${{ env.IMAGE }}@${{ steps.push.outputs.digest }}\`

          Pin this in a derived Dockerfile with:

          \`\`\`
          FROM ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          \`\`\`"
