name: Publish macOS viewer

# Builds the desktop admin viewer (apps/viewer) for macOS and attaches it to
# the release, so each server release has a matching viewer. Unsigned: the
# README explains how to open it past Gatekeeper. Nothing is deployed.
on:
  release:
    types: [published]
  # Builds without publishing when the workflow itself changes, to prove it works.
  pull_request:
    paths:
      - .github/workflows/publish-viewer.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write # upload the release asset
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json

      - name: Rust targets for a universal binary
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # A release tag v1.2.3 becomes the app version 1.2.3; pull requests build 0.0.0.
          version="${TAG#v}"
          if [ -z "$TAG" ]; then version="0.0.0"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag '$TAG' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install
        working-directory: apps/viewer
        run: npm ci

      - name: Build
        working-directory: apps/viewer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx tauri build --target universal-apple-darwin --bundles dmg \
            --config "{\"version\":\"$VERSION\"}"

      - name: Name the disk image
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          src=$(ls apps/viewer/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          out="wardby-viewer_${VERSION}_macos-universal.dmg"
          cp "$src" "$out"
          shasum -a 256 "$out" > "$out.sha256"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'release'
        with:
          subject-path: ${{ steps.dmg.outputs.path }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: wardby-viewer-macos
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 3
