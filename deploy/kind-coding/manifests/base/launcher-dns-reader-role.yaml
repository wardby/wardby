# The preflight's cluster-dns check (src/providers/jobs/kubernetes-preflight.ts)
# reads the kube-dns Service's ClusterIP from kube-system so the canary can
# prove that IP is unreachable under the run NetworkPolicy. This Role grants
# exactly that one read, nothing else in kube-system. Like launcher-role.yaml,
# no RoleBinding here — the kind control plane uses your admin kubeconfig;
# Plan 3 binds this Role to the Cloud Run service account too.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wardby-coding-dns-reader
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["kube-dns"]
    verbs: ["get"]
