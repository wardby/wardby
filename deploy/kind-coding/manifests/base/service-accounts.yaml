# No RBAC is bound to either ServiceAccount: coding-run workers get no
# Kubernetes API access at all, and the proxy only ever talks to the
# database and the model providers (see manifests/base/proxy.yaml's
# NetworkPolicy), never the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wardby-coding-worker
  namespace: wardby-coding
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wardby-coding-proxy
  namespace: wardby-coding
automountServiceAccountToken: false
