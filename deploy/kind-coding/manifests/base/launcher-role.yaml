# The Kubernetes launcher's own permissions in wardby-coding: only the
# verbs ClientNodeKubernetesApi (src/providers/jobs/kubernetes-client.ts)
# actually issues, and nothing else — no list/watch on pods (the seam only
# ever creates, reads, or deletes one named pod at a time; it never lists
# or watches), no get on secrets (the seam only ever creates or deletes
# them, never reads one back), no access to any other namespace. No
# RoleBinding is created here: the kind control plane runs every command
# (including the preflight and up.sh) against your own admin kubeconfig.
# Plan 3 binds this Role to the Cloud Run service account's identity in
# the target namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wardby-coding-launcher
  namespace: wardby-coding
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: [""]
    # The enforcement witness: readProxyWitness (src/providers/jobs/kubernetes-witness.ts) reads the
    # proxy Service's Endpoints to prove the deny port is exposed with a ready backend before a run
    # is gated on it. One object wide. EndpointSlice is the durable successor to Endpoints;
    # migrating is a follow-up and needs its own resourceNames grant.
    resources: ["endpoints"]
    resourceNames: ["wardby-coding-proxy"]
    verbs: ["get"]
---
# The preflight's `namespace` check reads the namespace back to confirm it exists
# and is the one configured, before any run object is created. A Namespace is a
# CLUSTER-scoped object, so this cannot be a rule in the Role above — a namespaced
# Role grants nothing on cluster-scoped resources, and RBAC accepts such a rule
# silently while `kubectl auth can-i get namespaces` still answers no. Hence a
# ClusterRole, held to a single object by resourceNames: it reads one namespace
# and can never enumerate or read another.
#
# This exists because the Role was finally USED. Every rule above was derived by
# reading the launcher's call sites; this one was missed because the preflight
# reads the namespace and nothing in the launcher's own path does. It surfaced
# the first time the control plane ran in-cluster under this Role instead of an
# operator's admin kubeconfig (2026-09-23), as `namespaces "wardby-coding" is
# forbidden` on a scheduled run. A Role that has never been exercised is a guess,
# however carefully it was derived.
#
# The name is not namespaced, so a second wardby namespace in the same cluster
# needs its own ClusterRole with its own resourceNames.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wardby-coding-launcher-namespace
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["wardby-coding"]
    verbs: ["get"]
