# TEST ONLY: the coding proxy and the native gateway reach wardby-sim (and nothing new besides).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wardby-flow-g-sim-egress
  namespace: wardby-coding
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [wardby-coding-proxy, wardby-native-gateway]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: wardby-sim
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
