# A THROWAWAY database for the Autopilot proof run, and nothing else.
#
# NOT FOR PRODUCTION. Storage is an emptyDir, so every restart loses all data;
# there is no backup, no replication, no resource headroom and no upgrade path.
# It exists because the in-cluster proxy needs a DATABASE_URL it can reach and
# the control plane must share it, and because a managed database would be a
# second billable resource with its own teardown for a smoke run that needs no
# durability. It is destroyed with the cluster.
#
# The password is supplied at apply time from the wardby-coding-proxy-env
# Secret's own DATABASE_URL; nothing here contains a credential.
apiVersion: v1
kind: Service
metadata:
  name: wardby-throwaway-db
  namespace: wardby-coding
  labels:
    app.kubernetes.io/name: wardby-throwaway-db
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wardby-throwaway-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wardby-throwaway-db
  namespace: wardby-coding
  labels:
    app.kubernetes.io/name: wardby-throwaway-db
spec:
  serviceName: wardby-throwaway-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wardby-throwaway-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wardby-throwaway-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: wardby-throwaway-db-env
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wardby"]
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 4Gi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
# The proxy and the control plane reach the throwaway database; nothing else in
# the namespace may, and the database itself gets no egress at all. A coding-run
# pod is not on this list and never will be — its own policy permits exactly one
# destination, and this is the other end of that guarantee.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wardby-throwaway-db
  namespace: wardby-coding
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wardby-throwaway-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wardby-coding-proxy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wardby-control-plane
      ports:
        - protocol: TCP
          port: 5432
