# GKE only: the native sandbox gateway logs in to Cloud SQL as its own Google identity
# (deploy/gke/database-iam.tf, `gateway`), through its own Auth Proxy sidecar, and runs at the
# control plane's priority (priority.yaml) -- sandbox runs stop when it is preempted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wardby-native-gateway
  namespace: wardby-coding
  annotations:
    iam.gke.io/gcp-service-account: wardby-gateway-gsa-email
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wardby-native-gateway
  namespace: wardby-coding
spec:
  template:
    spec:
      priorityClassName: wardby-control-plane
      initContainers:
        # Keep this image digest in step with the other Auth Proxy sidecars: proxy-cloudsql.yaml, control-plane.yaml, migrate/job.yaml and deploy/gke/bootstrap-grants-job.yaml.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4@sha256:88501f0a695a586988add1b8a206fdf3f29f9a1a3deeb9b45ef2b1481ea6be83
          # A native sidecar: starts before the app and stops after it.
          restartPolicy: Always
          args:
            - --auto-iam-authn
            - --private-ip
            - --address=127.0.0.1
            - --port=5432
            - --structured-logs
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9090
            - --exit-zero-on-sigterm
            - wardby-instance-connection-name
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 2
            failureThreshold: 60
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 100Mi
      containers:
        - name: gateway
          env:
            # The only source of DATABASE_URL: the Secret (wardby-native-gateway-env) carries none.
            - name: DATABASE_URL
              value: wardby-gateway-database-url
