# The native gateway resolves the model providers and its tools' fetch targets. Autopilot pods
# resolve through the NodeLocal DNSCache at 169.254.20.10, which the base policy's internet rule
# excepts -- see proxy-dns-egress.yaml for the measurement. Sandbox run pods are unaffected: their
# own policy permits the gateway's port and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wardby-native-gateway-dns
  namespace: wardby-coding
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wardby-native-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
