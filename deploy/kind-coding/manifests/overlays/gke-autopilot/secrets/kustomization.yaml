# The Secrets the Deployments read, synced by External Secrets. deploy/gke/up.sh
# applies these files one at a time rather than through this kustomization, so
# it can put the canary read (canary.yaml, deliberately not listed here) between
# the SecretStore and the real ExternalSecrets. It does so after the namespace
# exists and ESO is installed, and before the main gke-autopilot overlay, so
# the Secrets are synced before any Deployment starts. Placeholders
# (wardby-gcp-project, wardby-cluster-location, wardby-cluster-name,
# wardby-secret-prefix) are substituted at apply time.
resources:
  - store.yaml
  - external-secrets.yaml
