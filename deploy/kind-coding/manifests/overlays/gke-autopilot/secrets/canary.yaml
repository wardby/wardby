# A throwaway read, NOT listed in kustomization.yaml. deploy/gke/up.sh applies
# it after the SecretStore and waits for it to sync before it touches any live
# Secret: kind cannot test Workload Identity, so this is the first proof that
# External Secrets can really read Secret Manager. up.sh deletes it straight
# after; ESO owns the target Secret, so that goes with it. The key is one that
# holds no credential worth protecting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardby-secrets-canary
  namespace: wardby-coding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: wardby-secrets-canary
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: wardby-secret-prefix-github-app-id
