# A throwaway read, NOT listed in kustomization.yaml. deploy/gke/up.sh applies
# it after the SecretStore and waits for it to sync before it touches any live
# Secret: kind cannot test Workload Identity, so this is the first proof that
# External Secrets can really read Secret Manager. It reads every key the
# control-plane ExternalSecret reads (minus the AUTH_PROVIDER template) so a
# per-secret IAM grant that lags moments behind terraform fails the canary --
# and leaves the live Secrets untouched -- instead of failing only after the
# handover. up.sh deletes it straight after; ESO owns the target Secret, so
# that goes with it. The target Secret therefore briefly holds real values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardby-secrets-canary
  namespace: wardby-coding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: wardby-secrets-canary
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: wardby-secret-prefix-database-url
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: wardby-secret-prefix-openai-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: wardby-secret-prefix-anthropic-api-key
    - secretKey: SECRET_APP_KEY
      remoteRef:
        key: wardby-secret-prefix-secret-app-key
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: wardby-secret-prefix-github-app-id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: wardby-secret-prefix-github-app-private-key
    - secretKey: AUTH_SIGNING_KEY
      remoteRef:
        key: wardby-secret-prefix-auth-signing-key
    - secretKey: AUTH_CREDENTIAL_HASH_KEY
      remoteRef:
        key: wardby-secret-prefix-auth-credential-hash-key
