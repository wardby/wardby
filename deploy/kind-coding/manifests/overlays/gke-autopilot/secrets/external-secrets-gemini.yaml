# Google AI Studio (Gemini) key for native agents (docs/models.md), synced only
# when the operator sets GEMINI_API_KEY. Deliberately not listed in
# kustomization.yaml: deploy/gke/up.sh applies it when seed-secrets.mjs reports
# the key set, and deletes it when it is not. The control plane and the native
# gateway read the target Secret with optional: true.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardby-gemini-env
  namespace: wardby-coding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: wardby-gemini-env
    creationPolicy: Owner
  data:
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: wardby-secret-prefix-gemini-api-key
