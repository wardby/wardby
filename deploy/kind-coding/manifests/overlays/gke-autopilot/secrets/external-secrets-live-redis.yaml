# Redis for live editing across control-plane copies (docs/availability.md), synced only when the operator
# sets one. Deliberately not listed in kustomization.yaml: deploy/gke/up.sh applies it when seed-secrets.mjs
# reports the URL set, and deletes it when it is not. The control plane reads the target Secret with
# optional: true, so a deployment without Redis starts without it (documents are pinned to one copy).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardby-live-redis-env
  namespace: wardby-coding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: wardby-live-redis-env
    creationPolicy: Owner
  data:
    - secretKey: WARDBY_LIVE_REDIS_URL
      remoteRef:
        key: wardby-secret-prefix-live-redis-url
