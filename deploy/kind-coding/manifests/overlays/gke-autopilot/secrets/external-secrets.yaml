# Produce the two Secrets the Deployments already read with envFrom, so no
# Deployment changes. Owner: ESO manages each Secret and it goes away with its
# ExternalSecret. Retain: a secret deleted in Secret Manager does not remove the
# Kubernetes Secret. A provider error never deletes it either; ESO keeps the last
# synced value and retries.
#
# Pods read the environment only at start, so a rotated value reaches them on
# the next `kubectl rollout restart`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardby-coding-proxy-env
  namespace: wardby-coding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: wardby-coding-proxy-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: wardby-secret-prefix-openai-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: wardby-secret-prefix-anthropic-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wardby-control-plane-env
  namespace: wardby-coding
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: wardby-control-plane-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      # Merge: keep every synced key below and add this constant alongside.
      mergePolicy: Merge
      data:
        AUTH_PROVIDER: self-hosted
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: wardby-secret-prefix-openai-api-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: wardby-secret-prefix-anthropic-api-key
    - secretKey: SECRET_APP_KEY
      remoteRef:
        key: wardby-secret-prefix-secret-app-key
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: wardby-secret-prefix-github-app-id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: wardby-secret-prefix-github-app-private-key
    - secretKey: GITHUB_APP_WEBHOOK_SECRET
      remoteRef:
        key: wardby-secret-prefix-github-app-webhook-secret
    - secretKey: AUTH_SIGNING_KEY
      remoteRef:
        key: wardby-secret-prefix-auth-signing-key
    - secretKey: AUTH_CREDENTIAL_HASH_KEY
      remoteRef:
        key: wardby-secret-prefix-auth-credential-hash-key
