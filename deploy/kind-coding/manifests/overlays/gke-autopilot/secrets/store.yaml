# The identity ESO uses to read Secret Manager. No pod runs as it; ESO requests
# a token for it and exchanges that through Workload Identity. Terraform grants
# it read access to exactly the wardby secrets (deploy/gke/secrets.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wardby-secrets-reader
  namespace: wardby-coding
automountServiceAccountToken: false
---
# Namespaced, not a ClusterSecretStore: only ExternalSecrets in wardby-coding can
# use it. The cluster identity is set explicitly rather than read from the
# metadata server; up.sh substitutes all three.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: wardby-coding
spec:
  provider:
    gcpsm:
      projectID: wardby-gcp-project
      auth:
        workloadIdentity:
          clusterProjectID: wardby-gcp-project
          clusterLocation: wardby-cluster-location
          clusterName: wardby-cluster-name
          serviceAccountRef:
            name: wardby-secrets-reader
