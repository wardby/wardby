# GKE only: the base quota (8 CPU, 20 pods) plus the native sandbox's share -- the gateway's two
# replicas (each rounded up to 500m by Autopilot with its Auth Proxy sidecar) and
# NATIVE_SANDBOX_MAX_CONCURRENT plus NATIVE_SANDBOX_WARM_POOL_SIZE (control-plane.yaml) worker pods
# of 500m / 512Mi. Raise this together with CODING_MAX_CONCURRENT, NATIVE_SANDBOX_MAX_CONCURRENT,
# or NATIVE_SANDBOX_WARM_POOL_SIZE.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: wardby-coding
  namespace: wardby-coding
spec:
  hard:
    pods: "26"
    requests.cpu: "11"
    requests.memory: 20Gi
    limits.cpu: "11"
    limits.memory: 20Gi
