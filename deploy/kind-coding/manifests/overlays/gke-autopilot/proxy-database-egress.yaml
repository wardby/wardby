# The proxy's database reachability on this target.
#
# The proxy needs the database as much as the control plane does: it validates
# each run's capability token against it and records token usage and cost. A
# deployment that repoints only the control plane fails at the first coding run,
# not at deploy time.
#
# `wardby-database-cidr` is a placeholder substituted at apply time, like the
# image digests and the hostname. A managed database's address is target
# identity and never belongs in a tracked file. It is a CIDR rather than a pod
# selector because Cloud SQL is not in the cluster: it lives on the VPC, reached
# over the private services access peering, so no podSelector can name it.
#
# The Auth Proxy sidecar (proxy-cloudsql.yaml) reaches the instance itself on
# 3307, not Postgres's 5432: 5432 is only the loopback port it exposes to the
# proxy container (--port=5432), never a port this policy needs to open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wardby-coding-proxy-database
  namespace: wardby-coding
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wardby-coding-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: wardby-database-cidr
      ports:
        - protocol: TCP
          port: 3307
    # GKE metadata server: Workload Identity tokens for the Auth Proxy. Dataplane
    # V2 serves it at 169.254.169.252:988 as well as 169.254.169.254:80.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 988
