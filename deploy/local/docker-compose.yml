services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reevo
      POSTGRES_PASSWORD: reevo
      POSTGRES_DB: reevo
    ports:
      - "55432:5432"
    volumes:
      - reevo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reevo -d reevo"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  reevo-postgres-data:
