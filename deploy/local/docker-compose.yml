services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wardby
      POSTGRES_PASSWORD: wardby
      POSTGRES_DB: wardby
    ports:
      - "55432:5432"
    volumes:
      - wardby-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardby -d wardby"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  wardby-postgres-data:
