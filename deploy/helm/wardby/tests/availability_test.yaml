suite: availability
values:
  - ../ci/default-values.yaml
tests:
  - it: gives the control plane and the gateway a PodDisruptionBudget of one pod at a time
    templates:
      - control_plane.yaml
      - native_gateway.yaml
    documentSelector:
      path: kind
      value: PodDisruptionBudget
      matchMany: true
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow
      - notExists:
          path: spec.minAvailable
  - it: selects the control plane's own pods
    templates:
      - control_plane.yaml
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    asserts:
      - equal:
          path: metadata.name
          value: wardby-control-plane
      - equal:
          path: spec.selector.matchLabels
          value: { app.kubernetes.io/name: wardby-control-plane }
  - it: gives the single-replica coding proxy no PodDisruptionBudget by default
    templates:
      - coding_proxy.yaml
    asserts:
      - containsDocument:
          kind: PodDisruptionBudget
          apiVersion: policy/v1
        not: true
  - it: renders the coding proxy's PodDisruptionBudget when enabled
    templates:
      - coding_proxy.yaml
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    set:
      codingProxy.podDisruptionBudget.enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value: { app.kubernetes.io/name: wardby-coding-proxy }
  - it: renders minAvailable in place of maxUnavailable when set
    templates:
      - native_gateway.yaml
    documentSelector:
      path: kind
      value: PodDisruptionBudget
    set:
      nativeGateway.podDisruptionBudget.minAvailable: 1
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable
  - it: renders no PodDisruptionBudget when disabled
    templates:
      - control_plane.yaml
    set:
      controlPlane.podDisruptionBudget.enabled: false
    asserts:
      - containsDocument:
          kind: PodDisruptionBudget
          apiVersion: policy/v1
        not: true
  - it: adds no topology spread constraints by default
    templates:
      - coding_proxy.yaml
      - control_plane.yaml
      - native_gateway.yaml
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    asserts:
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
  - it: adds a workload's topology spread constraints to its pods
    templates:
      - control_plane.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      controlPlane.replicas: 2
      controlPlane.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: wardby-control-plane
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname
  - it: gives the coding proxy time to finish the requests in flight when it stops
    templates:
      - coding_proxy.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 600
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 10
