{{- range $key := list "controlPlane" "codingProxy" "nativeGateway" }}
{{- $sa := index $.Values.serviceAccounts $key }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "wardby.labels" $ | nindent 4 }}
  {{- with $sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* The control plane's pod mounts its token itself; the others never use one. */}}
{{- if ne $key "controlPlane" }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
---
# Identity of the run pods the control plane launches (a fixed name in the launcher). No token, no RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wardby-coding-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wardby.labels" . | nindent 4 }}
automountServiceAccountToken: false
