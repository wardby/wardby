services:
  proxy:
    image: node:22.22.0-alpine@sha256:e4bf2a82ad0a4037d28035ae71529873c069b13eb0455466ae0bc13363826e34
    command: ["node", "/app/task0b-proxy.mjs"]
    read_only: true
    init: true
    cap_drop: [ALL]
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      WARDBY_ABSOLUTE_MAX_USD: "0.02"
      WARDBY_EVIDENCE_PATH: /evidence/task0b-usage.jsonl
      WARDBY_MAX_OUTPUT_TOKENS: "128"
      WARDBY_MODEL: gpt-5.6-luna
      WARDBY_RUN_CAPABILITY: ${WARDBY_RUN_CAPABILITY}
    volumes:
      - ./task0b-proxy.mjs:/app/task0b-proxy.mjs:ro
      - ./task0b-metering.mjs:/app/task0b-metering.mjs:ro
      - ${TASK0B_KEY_FILE}:/run/secrets/openai_api_key:ro
      - ${TASK0B_EVIDENCE_DIR}:/evidence
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - worker
      - upstream
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 1s
      timeout: 2s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.task0b
    read_only: true
    init: true
    cap_drop: [ALL]
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      WARDBY_PROXY_URL: http://proxy:8080
      WARDBY_RUN_CAPABILITY: ${WARDBY_RUN_CAPABILITY}
    tmpfs:
      - /home/wardby:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
      - /workspace:rw,nosuid,size=64m,uid=10001,gid=10001
    networks:
      - worker

networks:
  worker:
    internal: true
  upstream: {}
